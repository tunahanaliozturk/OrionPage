<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <!--
    Orion family diagram template. Copy it, keep <defs> and <style>, replace the body.
    Classes: .step (our code) .ext (backend / external system) .ok (success end) .fail (failure path)
             .decision (diamond) .note (side remark) .lane (sequence lifeline)
    Arrows: class="flow" (main path), "flow alt" (alternate / failure path, dashed), "flow back" (response).
  -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Segoe UI", Inter, "Helvetica Neue", Arial, sans-serif; fill: #1e1b4b; }
    .title { font-size: 24px; font-weight: 700; }
    .subtitle { font-size: 14px; fill: #475569; }
    .label { font-size: 15px; font-weight: 600; }
    .small { font-size: 12.5px; fill: #475569; }
    .code { font-family: "Cascadia Code", Consolas, "SF Mono", monospace; font-size: 13px; fill: #3730a3; }
    .edge { font-size: 12.5px; fill: #334155; }
    .step { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2; }
    .ext { fill: #f0f9ff; stroke: #0284c7; stroke-width: 2; }
    .ok { fill: #ecfdf5; stroke: #059669; stroke-width: 2; }
    .fail { fill: #fef2f2; stroke: #dc2626; stroke-width: 2; }
    .decision { fill: #fffbeb; stroke: #d97706; stroke-width: 2; }
    .note { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .lane { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .flow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
    .flow.alt { stroke: #dc2626; stroke-dasharray: 6 4; marker-end: url(#arrow-fail); }
    .flow.back { stroke-dasharray: 6 4; }
    .badge { fill: #4f46e5; }
    .badge-text { font-size: 12px; font-weight: 700; fill: #ffffff; }
  </style>

  <rect width="1200" height="600" fill="#ffffff"/>

  <text class="title" x="40" y="52">OrionPage - packages and how the app reaches them</text>
  <text class="subtitle" x="40" y="78">The EF Core package reads your OrderBy chain and turns the cursor into a keyset WHERE; the framework-free core holds the page, the cursor codec and telemetry.</text>

  <!-- row 1: query path -->
  <rect class="step" x="40" y="110" width="270" height="150" rx="14"/>
  <text class="label" x="175" y="138" text-anchor="middle">Your list endpoint</text>
  <text class="code" x="60" y="166">db.Orders</text>
  <text class="code" x="60" y="188">.OrderByDescending(...)</text>
  <text class="code" x="60" y="210" style="font-variant-ligatures: none">.ThenByDescending(o =&gt; o.Id)</text>
  <text class="code" x="60" y="232">.ToKeysetPageAsync(cursor, 20)</text>

  <path class="flow" d="M310,185 L388,185"/>
  <text class="edge" x="349" y="175" text-anchor="middle">calls</text>

  <rect class="step" x="390" y="110" width="360" height="160" rx="14"/>
  <text class="label" x="570" y="138" text-anchor="middle">OrionPage.EntityFrameworkCore</text>
  <text class="code" x="410" y="166">ToKeysetPageAsync</text>
  <text class="code" x="410" y="190">KeysetOrderingParser (internal)</text>
  <text class="code" x="410" y="214">KeysetPredicateBuilder</text>
  <text class="code" x="410" y="238">KeysetSortKey</text>
  <text class="small" x="410" y="260">not NativeAOT-published (EF Core is not)</text>

  <path class="flow" d="M750,185 L828,185"/>
  <text class="edge" x="789" y="175" text-anchor="middle">query</text>

  <rect class="ext" x="830" y="110" width="330" height="140" rx="14"/>
  <text class="label" x="995" y="146" text-anchor="middle">EF Core + relational provider</text>
  <text class="small" x="995" y="174" text-anchor="middle">keyset WHERE seek on the sort index</text>
  <text class="code" x="995" y="202" text-anchor="middle">LIMIT pageSize + 1</text>
  <text class="small" x="995" y="228" text-anchor="middle">never OFFSET, never COUNT(*)</text>

  <path class="flow" d="M570,270 L570,328"/>
  <text class="code" x="582" y="304">Page&lt;T&gt;, Cursor</text>

  <!-- row 2: core -->
  <rect class="step" x="40" y="380" width="270" height="110" rx="14"/>
  <text class="label" x="175" y="410" text-anchor="middle">Startup (optional)</text>
  <text class="code" x="60" y="440" style="font-variant-ligatures: none">AddOrionPage(o =&gt; ...)</text>
  <text class="small" x="60" y="466">PageOptions + PageDiagnostics</text>

  <path class="flow" d="M310,435 L388,435"/>
  <text class="edge" x="349" y="425" text-anchor="middle">registers</text>

  <rect class="note" x="40" y="510" width="270" height="60" rx="10"/>
  <text class="small" x="56" y="536">ToKeysetPageAsync needs no DI;</text>
  <text class="small" x="56" y="556">it takes the page size directly.</text>

  <rect class="step" x="390" y="330" width="360" height="240" rx="14"/>
  <text class="label" x="570" y="360" text-anchor="middle">OrionPage (core)</text>
  <text class="code" x="410" y="392">Page&lt;T&gt;</text>
  <text class="code" x="410" y="416">Cursor (Encode, TryDecode)</text>
  <text class="code" x="410" y="440">InvalidCursorException</text>
  <text class="code" x="410" y="464">PageOptions</text>
  <text class="code" x="410" y="488">AddOrionPage</text>
  <text class="code" x="410" y="512">PageDiagnostics</text>
  <text class="small" x="410" y="550">reflection-free, NativeAOT-clean</text>

  <rect class="ext" x="830" y="330" width="330" height="80" rx="14"/>
  <text class="label" x="995" y="362" text-anchor="middle">Orion.Abstractions</text>
  <text class="small" x="995" y="388" text-anchor="middle">OrionInstrumentation, OrionTelemetry names</text>

  <path class="flow" d="M750,370 L828,370"/>
  <text class="edge" x="789" y="360" text-anchor="middle">builds on</text>

  <rect class="ext" x="830" y="440" width="330" height="120" rx="14"/>
  <text class="label" x="995" y="470" text-anchor="middle">OpenTelemetry tracing</text>
  <text class="code" x="995" y="494" text-anchor="middle">source Moongazing.OrionPage</text>
  <text class="small" x="995" y="518" text-anchor="middle">span OrionPage.keyset</text>
  <text class="small" x="995" y="540" text-anchor="middle">orion.page.size, orion.page.has_more</text>

  <path class="flow" d="M750,500 L828,500"/>
  <text class="edge" x="789" y="490" text-anchor="middle">emits</text>
</svg>
