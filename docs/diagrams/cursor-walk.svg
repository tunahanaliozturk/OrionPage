<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780">
  <!--
    Orion family diagram template. Copy it, keep <defs> and <style>, replace the body.
    Classes: .step (our code) .ext (backend / external system) .ok (success end) .fail (failure path)
             .decision (diamond) .note (side remark) .lane (sequence lifeline)
    Arrows: class="flow" (main path), "flow alt" (alternate / failure path, dashed), "flow back" (response).
  -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Segoe UI", Inter, "Helvetica Neue", Arial, sans-serif; fill: #1e1b4b; }
    .title { font-size: 24px; font-weight: 700; }
    .subtitle { font-size: 14px; fill: #475569; }
    .label { font-size: 15px; font-weight: 600; }
    .small { font-size: 12.5px; fill: #475569; }
    .code { font-family: "Cascadia Code", Consolas, "SF Mono", monospace; font-size: 13px; fill: #3730a3; }
    .edge { font-size: 12.5px; fill: #334155; }
    .step { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2; }
    .ext { fill: #f0f9ff; stroke: #0284c7; stroke-width: 2; }
    .ok { fill: #ecfdf5; stroke: #059669; stroke-width: 2; }
    .fail { fill: #fef2f2; stroke: #dc2626; stroke-width: 2; }
    .decision { fill: #fffbeb; stroke: #d97706; stroke-width: 2; }
    .note { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .lane { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .flow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
    .flow.alt { stroke: #dc2626; stroke-dasharray: 6 4; marker-end: url(#arrow-fail); }
    .flow.back { stroke-dasharray: 6 4; }
    .badge { fill: #4f46e5; }
    .badge-text { font-size: 12px; font-weight: 700; fill: #ffffff; }
  </style>

  <rect width="1200" height="780" fill="#ffffff"/>

  <text class="title" x="40" y="52">OrionPage - walking pages with the cursor</text>
  <text class="subtitle" x="40" y="78">Each page carries the cursor for the next one; the last page returns HasMore false and a null cursor, so the client stops.</text>

  <!-- participants -->
  <rect class="ext" x="60" y="104" width="220" height="66" rx="14"/>
  <text class="label" x="170" y="132" text-anchor="middle">Client</text>
  <text class="small" x="170" y="154" text-anchor="middle">keeps only the cursor</text>

  <rect class="step" x="440" y="104" width="320" height="66" rx="14"/>
  <text class="label" x="600" y="132" text-anchor="middle">Your endpoint</text>
  <text class="code" x="600" y="154" text-anchor="middle">ToKeysetPageAsync(cursor, 20)</text>

  <rect class="ext" x="920" y="104" width="220" height="66" rx="14"/>
  <text class="label" x="1030" y="132" text-anchor="middle">Database</text>
  <text class="small" x="1030" y="154" text-anchor="middle">index on (CreatedUtc, Id)</text>

  <path class="lane" d="M170,170 L170,680"/>
  <path class="lane" d="M600,170 L600,680"/>
  <path class="lane" d="M1030,170 L1030,680"/>

  <!-- 1 -->
  <circle class="badge" cx="192" cy="206" r="12"/>
  <text class="badge-text" x="192" y="210" text-anchor="middle">1</text>
  <text class="edge" x="385" y="210" text-anchor="middle">first request, no cursor</text>
  <path class="flow" d="M170,222 L598,222"/>

  <!-- 2 -->
  <circle class="badge" cx="622" cy="266" r="12"/>
  <text class="badge-text" x="622" y="270" text-anchor="middle">2</text>
  <text class="code" x="825" y="270" text-anchor="middle">ORDER BY CreatedUtc DESC, Id DESC LIMIT 21</text>
  <path class="flow" d="M600,282 L1028,282"/>

  <!-- 3 -->
  <circle class="badge" cx="1008" cy="326" r="12"/>
  <text class="badge-text" x="1008" y="330" text-anchor="middle">3</text>
  <text class="edge" x="815" y="330" text-anchor="middle">21 rows: the extra row means HasMore</text>
  <path class="flow back" d="M1030,342 L602,342"/>

  <!-- 4 -->
  <circle class="badge" cx="578" cy="386" r="12"/>
  <text class="badge-text" x="578" y="390" text-anchor="middle">4</text>
  <text class="code" x="370" y="390" text-anchor="middle">20 items, NextCursor c1, HasMore true</text>
  <path class="flow back" d="M600,402 L172,402"/>

  <!-- 5 -->
  <circle class="badge" cx="192" cy="446" r="12"/>
  <text class="badge-text" x="192" y="450" text-anchor="middle">5</text>
  <text class="edge" x="385" y="450" text-anchor="middle">next request with cursor c1</text>
  <path class="flow" d="M170,462 L598,462"/>

  <!-- 6 -->
  <circle class="badge" cx="622" cy="506" r="12"/>
  <text class="badge-text" x="622" y="510" text-anchor="middle">6</text>
  <text class="code" x="825" y="506" text-anchor="middle">WHERE CreatedUtc &lt; @c</text>
  <text class="code" x="825" y="526" text-anchor="middle">OR (CreatedUtc = @c AND Id &lt; @i) LIMIT 21</text>
  <path class="flow" d="M600,542 L1028,542"/>

  <!-- 7 -->
  <circle class="badge" cx="1008" cy="586" r="12"/>
  <text class="badge-text" x="1008" y="590" text-anchor="middle">7</text>
  <text class="edge" x="815" y="590" text-anchor="middle">5 rows: no extra row</text>
  <path class="flow back" d="M1030,602 L602,602"/>

  <!-- 8 -->
  <circle class="badge" cx="578" cy="646" r="12"/>
  <text class="badge-text" x="578" y="650" text-anchor="middle">8</text>
  <text class="code" x="370" y="650" text-anchor="middle">5 items, NextCursor null, HasMore false</text>
  <path class="flow back" d="M600,662 L172,662"/>

  <!-- end -->
  <rect class="ok" x="60" y="694" width="220" height="56" rx="14"/>
  <text class="label" x="170" y="718" text-anchor="middle">Stop</text>
  <text class="small" x="170" y="738" text-anchor="middle">HasMore is false</text>

  <rect class="note" x="440" y="694" width="700" height="56" rx="10"/>
  <text class="small" x="456" y="718">Page 10,000 costs the same as page 1: every continuation is an index seek after the cursor,</text>
  <text class="small" x="456" y="738">never OFFSET. SQL shape shown for a CreatedUtc DESC, Id DESC ordering with page size 20.</text>
</svg>
